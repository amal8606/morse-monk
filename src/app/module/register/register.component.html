<section class="fixed inset-0 z-50 flex flex-col md:flex-row h-screen overflow-auto font-body bg-[#f4f1ea] text-[#3e3020]">
  <!-- Left side: Logo and Welcome -->
  <div class="w-full md:w-1/2 flex flex-col justify-center items-center bg-[#e6dcc5] p-6">
    <h1 class="text-4xl font-heading font-bold">Morse Monk</h1>
    <p class="mt-2 text-lg italic">Join the Legacy</p>
  </div>

  <!-- Right side: Registration Form -->
  <div class="w-full md:w-1/2 flex flex-col justify-center items-center bg-white p-6">
    <form class="w-full max-w-md space-y-4 bg-[#fdfaf4] p-8 rounded-lg shadow-lg">
      <h2 class="text-2xl font-heading font-semibold text-center mb-4">Create Account</h2>

      <!-- Full Name -->
      <input
        type="text"
        placeholder="Full Name"
        class="w-full p-3 border border-[#c3b27a] bg-[#fffdf7] rounded focus:outline-none focus:ring-2 focus:ring-[#c3b27a]"
        required
      />

      <!-- Username -->
      <input
        type="text"
        placeholder="Username"
        class="w-full p-3 border border-[#c3b27a] bg-[#fffdf7] rounded focus:outline-none focus:ring-2 focus:ring-[#c3b27a]"
        required
      />

      <!-- Email -->
      <input
        type="email"
        placeholder="Email"
        class="w-full p-3 border border-[#c3b27a] bg-[#fffdf7] rounded focus:outline-none focus:ring-2 focus:ring-[#c3b27a]"
        required
      />

      <!-- Phone -->
      <input
        type="tel"
        placeholder="Phone Number"
        class="w-full p-3 border border-[#c3b27a] bg-[#fffdf7] rounded focus:outline-none focus:ring-2 focus:ring-[#c3b27a]"
        required
      />

      <!-- Date of Birth -->
      <input
        type="date"
        placeholder="Date of Birth"
        class="w-full p-3 border border-[#c3b27a] bg-[#fffdf7] rounded focus:outline-none focus:ring-2 focus:ring-[#c3b27a]"
        required
      />

      <!-- Password -->
      <input
        type="password"
        placeholder="Password"
        class="w-full p-3 border border-[#c3b27a] bg-[#fffdf7] rounded focus:outline-none focus:ring-2 focus:ring-[#c3b27a]"
        required
      />

      <!-- Confirm Password -->
      <input
        type="password"
        placeholder="Confirm Password"
        class="w-full p-3 border border-[#c3b27a] bg-[#fffdf7] rounded focus:outline-none focus:ring-2 focus:ring-[#c3b27a]"
        required
      />

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-[#5e4b2b] text-white py-2 rounded hover:bg-[#997950] transition"
      >
        Register
      </button>
    </form>
    <p class="text-sm text-center mt-2">Already have an account? 
  <a href="/login" class="text-[#5e4b2b] font-semibold underline hover:text-[#997950]">Login here</a>
</p>

  </div>
</section>
