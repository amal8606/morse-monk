<div class="p-10 h-screen px-3 max-w-3xl mx-auto fade-up-init">
  <!-- Filter Dropdown -->
  <div class="flex justify-end mb-4">
    <select class="border border-gray-300 rounded px-4 py-2">
      <option value="">All Countries</option>
      <option *ngFor="let country of countries" [value]="country">{{ country }}</option>
    </select>
  </div>

  <!-- User List -->
  <ul class="space-y-4">
    <li *ngFor="let user of filteredUsers()" (click)="openRecorderModal(user)"
        class="flex items-center gap-4 p-4 border rounded-lg shadow hover:shadow-md cursor-pointer transition bg-white">
      <img [src]="user.avatar" alt="{{ user.name }}" class="w-12 h-12 rounded-full object-cover" />
      <div>
        <div class="font-semibold text-lg">{{ user.name }}</div>
        <div class="text-sm text-gray-500">{{ user.country }}</div>
      </div>
    </li>
  </ul>
</div>

<!-- Modal -->
<div *ngIf="selectedUser" class="fixed inset-0 bg-black bg-opacity-40 flex justify-center items-center z-50 px-4 py-6 overflow-y-auto">
  <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-lg relative select-none" style="user-select: none; -webkit-user-select: none;">

    <!-- Close button -->
    <button class="absolute top-2 right-2 text-gray-400 hover:text-black" (click)="confirmCloseModal()">✖️</button>

    <!-- Header: Avatar + Name + WhatsApp -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-4">
      <div class="flex items-center gap-4">
        <img [src]="selectedUser.avatar" alt="{{ selectedUser.name }}" class="w-12 h-12 rounded-full object-cover" />
        <div>
          <div class="text-lg font-bold">{{ selectedUser.name }}</div>
          <div class="text-sm text-gray-500">{{ selectedUser.country }}</div>
        </div>
      </div>

      <button
        class="bg-green-500 text-white p-2 rounded-full hover:bg-green-600 shadow"
        title="Send via WhatsApp"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-5 h-5" viewBox="0 0 24 24">
          <path d="M12 .5a11.5 11.5 0 0 0-10.1 17.3L.5 23.5l5.9-1.6A11.5 11.5 0 1 0 12 .5Zm0 21A9.5 9.5 0 1 1 21.5 12 9.51 9.51 0 0 1 12 21.5ZM16.3 14.8c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2s-.8 1-.9 1.1-.3.2-.6.1a8.26 8.26 0 0 1-2.3-1.4A8.47 8.47 0 0 1 8 11.1c-.1-.2 0-.4.1-.5s.2-.3.3-.5a.42.42 0 0 0 0-.5c-.1-.2-.7-1.6-1-2.2s-.5-.5-.7-.5h-.6a1.12 1.12 0 0 0-.8.4A3.18 3.18 0 0 0 4.6 9a6.8 6.8 0 0 0 2.9 5.2 8.23 8.23 0 0 0 4.8 1.7h.2c.4 0 1.1-.3 1.3-.6s.6-.9.6-1.2-.3-.5-.6-.6Z" />
        </svg>
      </button>
    </div>

    <!-- Instructions -->
    <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-3 rounded mb-4 text-sm">
      <p>🎯 <strong>Instructions:</strong></p>
      <ul class="list-disc pl-5 mt-2 space-y-1">
        <li>Press and hold the <strong>🔊 Buzz</strong> button (or Ctrl key) to create Morse tones.</li>
        <li>Click ⏹️ Stop to finish recording.</li>
        <li>Download the audio, then send it via WhatsApp.</li>
      </ul>
    </div>

    <!-- Recorder -->
    <div class="flex flex-col items-center bg-gray-100 p-4 rounded space-y-4">
      <div class="flex flex-col sm:flex-row justify-center items-center gap-4 w-full">
        <button
          (mousedown)="startTone()" (mouseup)="stopTone()"
          (touchstart)="startTone()" (touchend)="stopTone()"
          class="bg-ink text-white font-heading text-lg px-6 sm:px-8 py-4 rounded-full shadow-lg active:scale-95 transition select-none touch-manipulation"
          style="user-select: none; -webkit-user-select: none;"
        >
          🔊 Hold to Buzz
        </button>

        <button (click)="stopRecording()" [disabled]="!isRecording"
          class="text-red-600 px-4 py-2 rounded hover:bg-red-100 disabled:opacity-50 w-full sm:w-auto">
          ⏹️ Stop
        </button>
      </div>

      <audio *ngIf="audioUrl" [src]="audioUrl" controls class="w-full mt-2"></audio>

      <button *ngIf="audioUrl" (click)="downloadAudio()"
        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 w-full sm:w-auto">
        ⬇️ Download
      </button>
    </div>
  </div>
</div>
